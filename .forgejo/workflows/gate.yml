# The quality gate of CLAUDE.md, run on each pull request and each push to main.
name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gate:
    name: Run the quality gate
    runs-on: ubuntu-latest
    container: ghcr.io/matthewbaggett/act-runner:php8.5-tools
    env:
      ALEX_ROOT: /opt/alex
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Lint prose
        run: .claude/agent-standards/bin/lint-prose-quality.php --base origin/main
      - name: Wiring
        run: .claude/check-wiring.sh --ci
